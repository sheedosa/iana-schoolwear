    <script>
      // Before the first paint: keep room for the "your school" line on phones when a school is remembered on this
      // device (or the page is a school's own), and hide the Home markup while an unknown path is being re-routed.
      (function () {
        var d = document.documentElement;
        try { if (localStorage.getItem("iana-school") || /\/schools\/[^/]+/.test(location.pathname)) d.setAttribute("data-school", "1"); } catch (e) {}
        if (/[?&]p=/.test(location.search)) d.setAttribute("data-rerouting", "1");
      })();
    </script>
