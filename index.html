<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>School uniform for south London schools | I&A Schoolwear</title>
    <meta name="description" content="Embroidered school uniform, PE kit and bags for Heathbrook, Fircroft, Allen Edwards, Trinity St Mary's, St Anne's and more, plus plain basics. Family-run in Tooting since 1993. Pay in 3 with Klarna." />
    <meta name="theme-color" content="#4169e1" />
    <link rel="icon" href="/iana-schoolwear/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="64x64" href="/iana-schoolwear/img/logo/favicon-64.png" />
    <link rel="apple-touch-icon" href="/iana-schoolwear/img/logo/apple-touch-icon.png" />
    <link rel="manifest" href="/iana-schoolwear/site.webmanifest" />
    <script>
      // Before the first paint: keep room for the "your school" line on phones when a school is remembered on this
      // device (or the page is a school's own), and hide the Home markup while an unknown path is being re-routed.
      (function () {
        var d = document.documentElement;
        try { if (localStorage.getItem("iana-school") || /\/schools\/[^/]+/.test(location.pathname)) d.setAttribute("data-school", "1"); } catch (e) {}
        if (/[?&]p=/.test(location.search)) d.setAttribute("data-rerouting", "1");
      })();
    </script>
    <meta property="og:site_name" content="I&A Schoolwear" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="School uniform for south London schools | I&A Schoolwear" />
    <meta property="og:description" content="Embroidered school uniform and plain basics. Family-run in Tooting since 1993." />
    <meta property="og:image" content="https://sheedosa.github.io/iana-schoolwear/img/og/og-home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://sheedosa.github.io/iana-schoolwear/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://sheedosa.github.io/iana-schoolwear/img/og/og-home.jpg" />
    <link rel="canonical" href="https://sheedosa.github.io/iana-schoolwear/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
